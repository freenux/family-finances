{{define "base"}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}} · 家庭财务</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23665efd'/%3E%3Cstop offset='1' stop-color='%234434d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ctext x='16' y='22.5' font-size='16' text-anchor='middle' fill='%23ffffff' font-family='PingFang SC,sans-serif' font-weight='600'%3E%E8%B4%A2%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/js/period_utils.js" defer></script>
  <script src="/static/js/tx_table.js" defer></script>
  <script src="/static/js/stats_page.js" defer></script>
  <script src="/static/js/dashboard_page.js" defer></script>
  <script src="/static/js/assets.js" defer></script>
  <script src="/static/js/vendor/htmx-1.9.12.min.js" defer></script>
  <script src="/static/js/vendor/alpinejs-3.14.1.min.js" defer></script>
</head>
<body>
<header class="app-header">
  <h1><span class="brand-seal">财</span>家庭财务</h1>
  {{if ne .Nav "auth"}}
  <nav>
    <a href="/"             class="{{if eq .Nav "stats"}}active{{end}}">仪表盘</a>
    <a href="/transactions" class="{{if eq .Nav "transactions"}}active{{end}}">收支流水</a>
    <a href="/cashflow"     class="{{if eq .Nav "dashboard"}}active{{end}}">现金流表</a>
    <a href="/rules"        class="{{if eq .Nav "rules"}}active{{end}}">分类规则</a>
    <a href="/assets"       class="{{if eq .Nav "assets"}}active{{end}}">资产快照</a>
    <a href="/profile"      class="{{if eq .Nav "profile"}}active{{end}}">画像</a>
    <a href="/buckets"      class="{{if eq .Nav "buckets"}}active{{end}}">四笔钱</a>
    <a href="/goals"        class="{{if eq .Nav "goals"}}active{{end}}">目标</a>
    <a href="/reports"      class="{{if eq .Nav "reports"}}active{{end}}">AI 财报</a>
    <a href="/advice"       class="{{if eq .Nav "advice"}}active{{end}}">AI 建议</a>
    <a href="/export"       class="{{if eq .Nav "export"}}active{{end}}">数据导出</a>
  </nav>
  {{end}}
</header>
<main>
  {{template "content" .}}
</main>
</body>
</html>
{{end}}
