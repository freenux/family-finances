{{define "content"}}
<script id="data-transactions" type="application/json">{{rawJSON .TransactionsJSON}}</script>
<script id="data-categories" type="application/json">{{rawJSON .CategoriesJSON}}</script>
<script id="data-rule" type="application/json">{{rawJSON .RuleJSON}}</script>
<script id="data-specials" type="application/json">{{rawJSON .SpecialsJSON}}</script>

<div x-data="txTable()"
     data-initial-period="{{.Period.Label}}"
     data-initial-granularity="{{.Period.Type}}"
     data-initial-account="{{.Account}}"
     x-cloak>
  <datalist id="member-list">
    <template x-for="m in memberOptions" :key="m"><option :value="m"></option></template>
  </datalist>
  <div class="stats-head">
    <div>
      <h2 class="title-zh"><span x-text="periodKey">{{.Period.Label}}</span> 收支流水</h2>
      <div class="subtitle">共 <span x-text="rows.length">{{len .Transactions}}</span> 条记录 · 点击列头排序</div>
      <div class="subtitle">逐笔定科目、改备注、标专项 / 不计收支 —— 就地改，报表自动跟着变</div>
    </div>
    <div class="flex-row" style="gap:14px;align-items:center">
      {{template "period_bar" .}}
      <a class="btn" href="/imports">＋ 导入账单</a>
    </div>
  </div>

  {{if .Flash}}
    <div class="section" style="padding:10px 14px;margin-bottom:14px;background:var(--accent-soft);color:var(--accent)">
      ✅ {{.Flash}}
    </div>
  {{end}}

  <template x-if="errorMsg">
    <div class="empty" style="color:var(--negative)">加载失败：<span x-text="errorMsg"></span></div>
  </template>

  <template x-if="!loading && rows.length === 0">
    <div class="empty">本期间暂无流水，点击右上角「＋ 导入账单」上传微信/支付宝账单。</div>
  </template>

  <template x-if="rows.length > 0">
    <div :style="loading ? 'opacity:0.5' : ''">
      <div class="tx-toolbar">
        <input class="tx-search" type="search" placeholder="搜索对方 / 说明 / 备注"
               x-model.debounce.200ms="keyword">

        <div class="tx-filter-group">
          <span class="label">方向：</span>
          <label><input type="radio" value="all"     x-model="directionFilter"> 全部</label>
          <label><input type="radio" value="expense" x-model="directionFilter"> 支出</label>
          <label><input type="radio" value="income"  x-model="directionFilter"> 收入</label>
        </div>

        <div class="tx-filter-group">
          <span class="label">来源：</span>
          <label><input type="checkbox" value="alipay" x-model="sourceFilter"> 支付宝</label>
          <label><input type="checkbox" value="wechat" x-model="sourceFilter"> 微信</label>
          <label><input type="checkbox" value="manual" x-model="sourceFilter"> 手填</label>
          <label><input type="checkbox" value="csv" x-model="sourceFilter"> CSV</label>
        </div>

        <div class="tx-filter-group">
          <span class="label">账户：</span>
          <label><input type="checkbox" value="husband" x-model="accountFilter"> 男主</label>
          <label><input type="checkbox" value="wife"    x-model="accountFilter"> 女主</label>
        </div>

        <div class="tx-filter-group">
          <span class="label">分类：</span>
          <select x-model="categoryFilter">
            <option value="">全部</option>
            <option value="__none__">⚠️ 未分类</option>
            <template x-for="g in groupedCategories" :key="g.groupId">
              <optgroup :label="g.groupName">
                <template x-for="c in g.items" :key="c.id">
                  <option :value="c.id" x-text="c.name"></option>
                </template>
              </optgroup>
            </template>
          </select>
        </div>

        <div class="tx-filter-group">
          <span class="label">成员：</span>
          <select x-model="memberFilter">
            <option value="">全部</option>
            <option value="__none__">未标注</option>
            <template x-for="m in memberOptions" :key="m">
              <option :value="m" x-text="m"></option>
            </template>
          </select>
        </div>

        <div class="tx-filter-group">
          <span class="label">专项：</span>
          <select x-model="specialFilter">
            <option value="">全部</option>
            <option value="__none__">仅日常（不含专项）</option>
            <option value="__any__">仅专项（任意）</option>
            <template x-for="s in specials" :key="s.id">
              <option :value="s.id" x-text="s.name"></option>
            </template>
          </select>
        </div>

        <div class="tx-filter-group">
          <span class="label">状态：</span>
          <label><input type="checkbox" value="pending_review" x-model="statusFilter"> 待核对</label>
          <label><input type="checkbox" value="confirmed"      x-model="statusFilter"> 已入账</label>
          <label><input type="checkbox" value="excluded"       x-model="statusFilter"> 不计收支</label>
        </div>

        <button class="btn secondary" @click="resetFilters()">清空筛选</button>
      </div>

      <div class="tx-summary">
        <span>筛选结果：<b x-text="filtered.length"></b> 条</span>
        <span>收入 <b class="positive" x-text="fmtYuan(totals.income)"></b></span>
        <span>支出 <b class="negative" x-text="fmtYuan(totals.expense)"></b></span>
        <span>净额 <b :class="totals.net >= 0 ? 'positive' : 'negative'" x-text="fmtYuan(totals.net)"></b></span>
        {{/* 合计只算「已入账」。不计收支的行仍然列在表里（淡显），但不进这三个数，
             否则一笔提现会同时被算进支出，跟报表对不上。*/}}
        <template x-if="totals.excludedCount > 0">
          <span class="meta-sm">（另有 <b x-text="totals.excludedCount"></b> 条不计收支，未计入上面三项）</span>
        </template>
      </div>

      <details class="tx-help">
        <summary>三个状态怎么用？借款、报销、退款该记在哪？</summary>
        <div>
          <p><b>待核对</b>：机器没认出来是什么科目，等你在这一行的下拉里指定。定完自动转「已入账」。</p>
          <p><b>已入账</b>：算进季/年报、仪表盘、预算、四笔钱的正经收支。</p>
          <p><b>不计收支</b>：不进任何报表。两种用法——一是<b>误记/重复</b>，二是<b>资金往来</b>：
             钱只是换了个口袋（提现、还信用卡、理财申赎），或者是债权债务的一出一回
             （借出去→收回来、垫钱→报销到账）。这类请在「分类」列选「资金往来 · 不计收支」下的科目，
             状态会自动变成「不计收支」，两头相抵刚好为零。</p>
          <p><b>退款要特殊对待</b>：它不能标「不计收支」——原来那笔支出还在报表里算着，
             没人去冲减它，支出就虚高了。正确做法是<b>直接改原来那笔支出的金额</b>，改成实付；
             全额退的话，把原支出那笔标「不计收支」即可。退款到账那笔本身不用记。</p>
        </div>
      </details>

      <template x-if="activeRule">
        <div class="rule-apply-bar">
          <div>
            <strong>规则匹配</strong>
            <span x-text="ruleLabel()"></span>
            <span>命中 <b x-text="filtered.length"></b> 条，应用后分类为</span>
            <b x-text="activeRule.category_name"></b>
            <span>，待应用 <b x-text="ruleApplyTargets.length"></b> 条</span>
          </div>
          <button class="btn" type="button" @click="applyRule()" :disabled="applyingRule || ruleApplyTargets.length === 0">
            <span x-text="applyingRule ? '应用中...' : (ruleApplyTargets.length === 0 ? '无需应用' : '应用到当前匹配流水')"></span>
          </button>
        </div>
      </template>

      <template x-if="specials.length > 0">
        <div class="rule-apply-bar">
          <div>
            <strong>批量归入专项</strong>
            <span>把当前筛选出的 <b x-text="filtered.length"></b> 条流水一次挂到某个专项上（装修一次几十上百笔，逐条改不现实）</span>
          </div>
          <div class="flex-row" style="gap:8px;align-items:center">
            <select class="inline-select" x-model="batchSpecialID">
              <option value="">— 选择专项 —</option>
              <option value="__clear__">清除专项（归回日常）</option>
              <template x-for="s in specials" :key="s.id">
                <option :value="s.id" x-text="s.name"></option>
              </template>
            </select>
            <button class="btn" type="button" @click="applyBatchSpecial()"
                    :disabled="batching || !batchSpecialID || filtered.length === 0">
              <span x-text="batching ? '处理中...' : '应用到当前筛选'"></span>
            </button>
          </div>
        </div>
      </template>

      <table class="tx-list editable">
        <colgroup>
          <col class="tx-col-date">
          <col class="tx-col-source">
          <col class="tx-col-account">
          <col class="tx-col-member">
          <col class="tx-col-direction">
          <col class="tx-col-description">
          <col class="tx-col-amount">
          <col class="tx-col-category">
          <col class="tx-col-special">
          <col class="tx-col-note">
          <col class="tx-col-status">
        </colgroup>
        <thead>
          <tr>
            <th @click="sortBy('occurred_at')" class="sortable">日期 <span x-text="sortIcon('occurred_at')"></span></th>
            <th @click="sortBy('source')"      class="sortable">来源 <span x-text="sortIcon('source')"></span></th>
            <th @click="sortBy('account')"     class="sortable">账户 <span x-text="sortIcon('account')"></span></th>
            <th @click="sortBy('member')"      class="sortable">成员 <span x-text="sortIcon('member')"></span></th>
            <th @click="sortBy('direction')"   class="sortable">方向 <span x-text="sortIcon('direction')"></span></th>
            <th @click="sortBy('counterparty')" class="sortable">对方 / 说明 <span x-text="sortIcon('counterparty')"></span></th>
            <th @click="sortBy('amount_fen')"  class="sortable">金额 <span x-text="sortIcon('amount_fen')"></span></th>
            <th @click="sortBy('category_id')" class="sortable">分类 <span x-text="sortIcon('category_id')"></span></th>
            <th @click="sortBy('special_id')"  class="sortable">专项 <span x-text="sortIcon('special_id')"></span></th>
            <th>备注</th>
            <th>状态</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="t in filtered" :key="t.id">
            {{/* row-muted：不计收支的行淡显，一眼看出"这条不进报表" */}}
            <tr :class="{ 'needs-review': !t.category_id, 'row-muted': t.status === 'excluded' }">
              <td x-text="t.occurred_at"></td>
              <td x-text="sourceLabel(t.source)"></td>
              <td>
                <select class="inline-select"
                        @change="patchAccount(t, $event.target.value)">
                  <option value="husband" :selected="t.account === 'husband'">男主</option>
                  <option value="wife"    :selected="t.account === 'wife'">女主</option>
                </select>
              </td>
              <td>
                <input class="inline-input" type="text" placeholder="成员" list="member-list" style="width:70px"
                       :value="t.member"
                       @blur="patchMember(t, $event.target.value)"
                       @keydown.enter="$event.target.blur()">
              </td>
              <td>
                <span :class="t.direction === 'income' ? 'badge' : 'badge warn'"
                      x-text="t.direction === 'income' ? '收' : '支'"></span>
              </td>
              <td>
                <div x-text="t.counterparty || '—'"></div>
                <div class="meta-sm" x-text="t.description"></div>
              </td>
              <td class="amount" :class="t.direction === 'income' ? 'positive' : 'negative'"
                  x-text="fmtYuan(t.amount_fen)"></td>
              <td>
                <select class="inline-select"
                        @change="patchCategory(t, $event.target.value)">
                  <option value="" :selected="!t.category_id">— 未分类 —</option>
                  <template x-for="g in groupedCategories" :key="g.groupId">
                    <optgroup :label="g.groupName">
                      <template x-for="c in g.items" :key="c.id">
                        <option :value="c.id" :selected="t.category_id === c.id" x-text="c.name"></option>
                      </template>
                    </optgroup>
                  </template>
                </select>
              </td>
              <td>
                {{/* 传 <select> 元素本身：选到「＋ 新建专项…」时要把它的值复位回真实归属 */}}
                <select class="inline-select"
                        @change="patchSpecial(t, $event.target)">
                  <option value="" :selected="!t.special_id">— 日常 —</option>
                  <template x-for="s in specials" :key="s.id">
                    <option :value="s.id" :selected="t.special_id === s.id" x-text="s.name"></option>
                  </template>
                  <option value="__new__">＋ 新建专项…</option>
                </select>
              </td>
              <td>
                <input class="inline-input" type="text" placeholder="备注"
                       :value="t.note"
                       @blur="patchNote(t, $event.target.value)"
                       @keydown.enter="$event.target.blur()">
              </td>
              <td>
                <select class="inline-select"
                        @change="patchStatus(t, $event.target.value)">
                  <option value="pending_review" :selected="t.status === 'pending_review'">待核对</option>
                  <option value="confirmed"      :selected="t.status === 'confirmed'">已入账</option>
                  <option value="excluded"       :selected="t.status === 'excluded'">不计收支</option>
                </select>
              </td>
            </tr>
          </template>
          <tr x-show="filtered.length === 0">
            <td colspan="11" class="empty" style="padding:30px">没有匹配当前筛选条件的记录。</td>
          </tr>
        </tbody>
      </table>
    </div>
  </template>
</div>
{{end}}

{{define "page"}}{{template "base" .}}{{end}}
