{{define "content"}}
<div x-data="dashboardPage()"
     data-initial-period="{{.Period.Label}}"
     data-initial-granularity="{{.Period.Type}}"
     data-initial-account="{{.Account}}"
     x-cloak>
  <div class="stats-head">
    <div>
      <h2 class="title-zh" x-text="pageTitle">{{.Period.Label}} 家庭财报</h2>
      <div class="subtitle">对齐原 Excel 收支表结构，实时按流水聚合</div>
    </div>
    <div class="flex-row" style="gap:14px;align-items:center">
      {{template "period_bar" .}}
      <a class="btn" href="/transactions/new">＋ 录入流水</a>
    </div>
  </div>

  <template x-if="errorMsg">
    <div class="empty" style="color:var(--negative)">加载失败：<span x-text="errorMsg"></span></div>
  </template>

  <div id="report-container" :style="loading ? 'opacity:0.5' : ''">
    {{template "report_view" .}}
  </div>
</div>
{{end}}

{{define "page"}}{{template "base" .}}{{end}}
