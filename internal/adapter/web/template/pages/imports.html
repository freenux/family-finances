{{define "content"}}
<div class="page-title">
  <div>
    <h2>导入账单</h2>
    <div class="meta">支持微信支付 xlsx 与支付宝 csv；重复交易单号自动跳过</div>
  </div>
  <a class="btn secondary" href="/transactions">返回流水列表</a>
</div>

{{if .Error}}
  <div class="section" style="padding:12px;color:var(--negative);margin-bottom:16px">⚠️ {{.Error}}</div>
{{end}}

<form class="form-grid" method="POST" action="/imports" enctype="multipart/form-data">
  <label class="full">
    账单来源
    <select name="source" required>
      <option value="alipay">支付宝（.csv，GB18030 编码）</option>
      <option value="wechat">微信支付（.xlsx）</option>
    </select>
  </label>

  <label class="full">
    账单文件
    <input type="file" name="file" required accept=".csv,.xlsx">
  </label>

  <div class="full" style="color:var(--muted);font-size:12px;line-height:1.7">
    解析时会自动：<br>
    · 过滤非"交易成功/支付成功/已转账"的行<br>
    · 跳过支付宝"亲友代付/转账红包"、微信"亲属卡/充值提现"等中性交易<br>
    · 按内置规则尝试分类，未命中的记为<strong>待处理</strong>，可在列表页就地改<br>
    · 以 (来源 + 交易单号) 去重，重复上传不会产生副本
  </div>

  <div class="form-actions">
    <a class="btn secondary" href="/transactions">取消</a>
    <button class="btn" type="submit">解析并导入</button>
  </div>
</form>
{{end}}

{{define "page"}}{{template "base" .}}{{end}}
