{{define "period_selector"}}
<div class="period-selector"
     hx-get="/partials/report"
     hx-target="#report-container"
     hx-trigger="change from:#period-input, change from:#period-type-input">
  <select id="period-type-input" name="type">
    <option value="quarterly" {{if eq .Period.Type "quarterly"}}selected{{end}}>季度</option>
    <option value="annual"    {{if eq .Period.Type "annual"}}selected{{end}}>年度</option>
  </select>
  <select id="period-input" name="period">
    {{range .PeriodOptions}}
      <option value="{{.}}" {{if eq . $.Period.Label}}selected{{end}}>{{.}}</option>
    {{end}}
  </select>
</div>
{{end}}
